# SDD Configuration - api-user
# This file configures the Spec-Driven Development workflow for this project.

schema: spec-driven

# Artifact store mode: where SDD artifacts are persisted
# - engram: local memory only (solo dev)
# - openspec: file-based in openspec/ (git-shareable)
# - hybrid: both (recommended for teams)
# - none: ephemeral (no persistence)
artifact_store:
  mode: hybrid

# Strict TDD Mode: enforce test-first workflow
strict_tdd: true

# Project context
context: |
  Tech stack: NestJS 10.x + TypeScript 5.5
  Database: MongoDB + Mongoose
  API: REST with Fastify adapter
  Testing: Jest + ts-jest
  Linting: Biome

# SDD workflow rules
rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include architecture decisions with rationale
    - Document file changes clearly
  tasks:
    - Group tasks by phase (foundation, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Reference spec scenarios for verification
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Sync delta specs to main specs before archiving
    - Warn before merging destructive deltas

# Testing configuration
testing:
  runner: jest
  framework: ts-jest
  environment: node
  command: npm test
  unit_command: npm run test:unit
  e2e_command: npm run test:e2e
  cov_command: npm run test:cov
  watch_command: npm run test:watch
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  coverage_command: npm run test:cov
  coverage_thresholds:
    statements: 55
    branches: 45
    functions: 35
    lines: 55
  setup_file: test/jest.setup.ts
  unit_pattern: "*.spec.ts"
  e2e_pattern: "*.e2e-spec.ts"
  timeout: 30000
  strict_tdd: true
