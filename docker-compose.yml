services:
  db-user:
    image: mongo:6.0.3
    container_name: db-user
    expose:
      - 27017
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - api-user-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=api_user
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: redis-user
    restart: always
    expose:
      - "6379"
    ports:
      - "6379:6379"
    volumes:
      - redis-user-data:/data
    networks:
      - default

  api-user:
    image: countergank/api-user:${NODE_ENV:-development}-${VERSION:-1.0.0}
    container_name: api-user
    restart: always
    build:
      dockerfile: Dockerfile
      context: .
      target: development
    depends_on:
      - db-user
      - redis
    command: npm run start:debug
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    environment:
      - DATABASE_HOST=db-user
      - REDIS_HOST=redis
    volumes:
      - .:/usr/src/app
    networks:
      - default

volumes:
  api-user-data:
    driver: local
  redis-user-data:
    driver: local

networks:
  default:
    name: api-user-net
    driver: bridge
