services:
  db-user:
    image: mongo:6.0.3
    container_name: db-user
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    expose:
      - "27017"
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - api-user-data:/data/db
    networks:
      - default

  mongo-init:
    image: mongo:6.0.3
    depends_on:
      db-user:
        condition: service_started
    entrypoint: >
      bash -c " sleep 5 && mongosh --host db-user:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"db-user:27017\"}]})' && for i in $$(seq 1 30); do
        state=$$(mongosh --host db-user:27017 --quiet --eval 'try { rs.status().myState } catch(e) { 0 }');
        [ \"$$state\" = \"1\" ] && break;
        sleep 1;
      done && mongosh --host db-user:27017 --eval 'db.getSiblingDB(\"admin\").createUser({user: \"dev_user\", pwd: \"dev_password\", roles: [{role: \"root\", db: \"admin\"}]})' 2>/dev/null || true && echo 'mongo-init: done' "
    restart: "no"
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: redis-user
    restart: always
    expose:
      - "6379"
    ports:
      - "6379:6379"
    volumes:
      - redis-user-data:/data
    networks:
      - default

  mailpit:
    # Buzón de prueba de la suite Hurl (COU-325). No arranca con `make up`: vive bajo el
    # profile `mail` para no sumar un contenedor al stack por defecto.
    #   docker compose --profile mail up -d mailpit
    # 1025 = SMTP (a donde apunta la app local), 8025 = UI/API (lo que lee Hurl y el navegador).
    image: axllent/mailpit
    container_name: mailpit
    profiles:
      - mail
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - default

  minio:
    # Storage S3-compatible para desarrollo del driver de fotos (#546). Igual
    # que mailpit: no arranca con `make up`; vive bajo el profile `storage-s3`
    # y se activa con COMPOSE_PROFILES=storage-s3 en el .env de la raíz del
    # proyecto, o por comando: docker compose --profile storage-s3 up -d minio
    # Imagen de Chainguard: MinIO borró minio/minio de Docker Hub (09/2026) y
    # quay.io exige login; este fork se mantiene y se puede pull anonimamente.
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-user
    profiles:
      - storage-s3
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      # Dev-only: bound to loopback so the object store is never reachable from
      # the LAN; the API host reaches it via localhost:9000 or minio:9000.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-user-data:/data
    healthcheck:
      # La imagen Chainguard no trae curl; el `mc` embebido hace las veces.
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  minio-init:
    # Crea el bucket y deja sus objetos en lectura pública (patrón mongo-init).
    # Usa el `mc` embebido en la misma imagen: minio/mc ya no se distribuye y el
    # JSON de PutBucketPolicy no sobrevive al escapado de YAML + shell.
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - storage-s3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET" &&
        echo 'minio-init: bucket listo'
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-countergank-assets}
    restart: "no"
    networks:
      - default

  api-user:
    image: countergank/api-user:${NODE_ENV:-development}-${VERSION:-1.0.0}
    container_name: api-user
    restart: always
    build:
      dockerfile: Dockerfile
      context: .
      target: development
    depends_on:
      db-user:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: npm run start:debug
    ports:
      - "3000:3000"
    env_file:
      # COU-312: la ruta la resuelve `make` y llega como ENV_FILE. `required:
      # false` evita que un comando que no necesita el contenido (`down`, `logs`,
      # `config`) falle cuando el archivo de esta máquina no existe.
      - path: ${ENV_FILE:-.env.development}
        required: false
    environment:
      - DATABASE_HOST=db-user
      - REDIS_HOST=redis
    volumes:
      - .:/usr/src/app
    networks:
      - default

volumes:
  api-user-data:
    driver: local
  redis-user-data:
    driver: local
  minio-user-data:
    driver: local

networks:
  default:
    name: api-user-net
    driver: bridge
