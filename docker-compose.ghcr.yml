# Docker Compose override for testing GHCR image
# Usage: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Requires: .env.production (or set env vars via environment section below)

services:
  api-user:
    image: ghcr.io/countergank/api-user:v${VERSION:-1.1.0}
    build: null
    command: ["node", "dist/main.js"]
    volumes: []
    environment:
      - DATABASE_HOST=db-user
      - DATABASE_PORT=27017
      - DATABASE_USER=${DATABASE_USER:-dev_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-dev_password}
      - DATABASE_NAME=${DATABASE_NAME:-api_user}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=${NODE_ENV:-production}
      - VERSION=${VERSION:-1.1.0}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_PASSWORD=${ENCRYPTION_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - EXAMPLE_MICROSERVICE_ENABLED=${EXAMPLE_MICROSERVICE_ENABLED:-false}
      - EXAMPLE_MICROSERVICE_HOST=localhost
      - EXAMPLE_MICROSERVICE_PORT=3001
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.test.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-test@test.com}
      - EMAIL_PASS=${EMAIL_PASS:-testpass}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_FROM=${EMAIL_FROM:-test@test.com}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - path: .env.production
        required: false
