name: SDD Issues Sync

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**', 'chore/**']
    paths:
      - 'openspec/changes/**'
      - '!openspec/changes/archive/**'
      - 'openspec/specs/**'
  pull_request:
    paths:
      - 'openspec/changes/**'
      - '!openspec/changes/archive/**'
      - 'openspec/specs/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch type and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Detect branch type
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          case "$branch" in
            feature/*)  label="feature" ;;
            bugfix/*)   label="bugfix" ;;
            hotfix/*)   label="hotfix" ;;
            release/*)  label="release" ;;
            chore/*)    label="chore" ;;
            *)          label="enhancement" ;;
          esac
          BRANCH_TYPE="$label"
          echo "Detected branch type: $BRANCH_TYPE"
          
          # Find base commit
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          fi
          
          # Find changed directories
          if [[ -n "$base" ]]; then
            changes=$(git diff --name-only "$base" HEAD -- "openspec/changes/" "openspec/specs/" 2>/dev/null | grep -v '^$' | cut -d'/' -f3 | sort -u)
          else
            changes=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null)
          fi
          
          # Process each change
          echo "$changes" | while read -r dir; do
            [[ -z "$dir" ]] && continue
            echo "Processing change: $dir"
            
            # Get title from proposal.md
            title="$dir"
            summary="SDD change: $dir"
            if [[ -f "openspec/changes/$dir/proposal.md" ]]; then
              title=$(grep "^# " "openspec/changes/$dir/proposal.md" | sed 's/^# //')
              summary=$(awk '/^## /{found=1; next} found && NF{print; exit}' "openspec/changes/$dir/proposal.md" | head -1)
              [[ -z "$summary" ]] && summary="SDD change: $dir"
            fi
            
            # Check for existing issue (deduplication)
            existing=$(gh issue list --search "[SDD] $title in:title" --state open --json number --jq '.[0].number' 2>/dev/null)
            
            if [[ -n "$existing" ]]; then
              echo "Issue already exists: #$existing - skipping $dir"
              continue
            fi
            
            # Build enriched issue body
            body="## Summary

**Change**: $dir
**Branch**: $branch
**Type**: $BRANCH_TYPE
**Phase**: implementation

### Overview
$summary

### Files Changed
\`\`\`
$(git diff --name-only "$base" HEAD -- "openspec/changes/$dir/" 2>/dev/null | sed 's/^/  /' || echo "  (no changes detected)")
\`\`\`

---
*Generated by SDD Issue Sync v2*"
            
            # Create main issue
            parent_num=$(gh issue create \
              --title "[SDD] $title" \
              --body "$body" \
              --label "sdd" \
              --label "$BRANCH_TYPE" \
              --json number --jq '.number')
            
            echo "Created main issue #$parent_num for $dir"
            
            # Create task issues with parent reference
            if [[ -f "openspec/changes/$dir/tasks.md" ]]; then
              while IFS= read -r task; do
                gh issue create \
                  --title "[SDD-Task] $dir: $task" \
                  --body "**Parent**: #$parent_num

**Change**: $dir
**Branch**: $branch
**Task**: $task" \
                  --label "sdd" \
                  --label "task"
              done < <(grep "^- \[ \] " "openspec/changes/$dir/tasks.md" | sed 's/^- \[ \] //')
              echo "Created task issues for $dir"
            fi
          done

  close-archived:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and close archived issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODIFIED: ${{ toJson(github.event.head_commit.modified) }}
        run: |
          for path in $(echo "$MODIFIED" | jq -r '.[]'); do
            if [[ "$path" == openspec/changes/archive/* ]]; then
              change=$(echo "$path" | cut -d'/' -f4)
              echo "Processing archived change: $change"
              
              # Find and close main issue
              main_issue=$(gh issue list --search "[SDD] $change in:title" --state open --json number --jq '.[0].number' 2>/dev/null)
              if [[ -n "$main_issue" ]]; then
                gh issue close "$main_issue" --comment "Change '$change' has been archived. This issue is now closed."
                gh issue edit "$main_issue" --add-label "archived"
                echo "Closed main issue #$main_issue"
              fi
              
              # Find and close task issues
              gh issue list --search "[SDD-Task] $change in:title" --state open --json number --jq '.[].number' 2>/dev/null | while read -r task_num; do
                gh issue close "$task_num" --comment "Parent change '$change' has been archived. This task is now closed."
                gh issue edit "$task_num" --add-label "archived"
                echo "Closed task issue #$task_num"
              done
            fi
          done
