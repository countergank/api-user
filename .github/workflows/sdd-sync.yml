name: SDD Issues Sync

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**', 'chore/**']
    paths:
      - 'openspec/changes/**'
      - '!openspec/changes/archive/**'
      - 'openspec/specs/**'
  pull_request:
    paths:
      - 'openspec/changes/**'
      - '!openspec/changes/archive/**'
      - 'openspec/specs/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch type and find changes
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          case "$branch" in
            feature/*) label="feature" ;;
            bugfix/*) label="bugfix" ;;
            hotfix/*) label="hotfix" ;;
            release/*) label="release" ;;
            chore/*) label="chore" ;;
            *) label="enhancement" ;;
          esac
          echo "BRANCH_TYPE=$label" >> $GITHUB_ENV
          echo "BRANCH_NAME=$branch" >> $GITHUB_ENV
          
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          fi
          echo "BASE_COMMIT=$base" >> $GITHUB_ENV
          
          if [[ -n "$base" ]]; then
            changes=$(git diff --name-only "$base" HEAD -- "openspec/changes/" "openspec/specs/" 2>/dev/null | cut -d'/' -f3 | sort -u)
          else
            changes=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null)
          fi
          echo "CHANGES=$changes" >> $GITHUB_ENV

      - name: Create SDD issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$CHANGES" | while read -r dir; do
            [[ -z "$dir" ]] && continue
            
            title="$dir"
            summary="SDD change: $dir"
            if [[ -f "openspec/changes/$dir/proposal.md" ]]; then
              title=$(grep "^# " "openspec/changes/$dir/proposal.md" | sed 's/^# //')
              summary=$(awk '/^## /{found=1; next} found && NF{print; exit}' "openspec/changes/$dir/proposal.md" | head -1)
              [[ -z "$summary" ]] && summary="SDD change: $dir"
            fi
            
            existing=$(gh issue list --search "[SDD] $title in:title" --state open --json number --jq '.[0].number')
            if [[ -n "$existing" ]]; then
              echo "Skipping $dir - issue #$existing exists"
              continue
            fi
            
            files_changed=$(git diff --name-only "$BASE_COMMIT" HEAD -- "openspec/changes/$dir/" 2>/dev/null | sed 's/^/  /' || echo "  (no changes)")
            
            body_file="/tmp/issue_body_${dir//-/}_main.txt"
            printf '## Summary\n\nChange: %s\nBranch: %s\nType: %s\nPhase: implementation\n\n### Overview\n%s\n\n### Files Changed\n```\n%s\n```\n\n---\nGenerated by SDD Issue Sync v2\n' "$dir" "$BRANCH_NAME" "$BRANCH_TYPE" "$summary" "$files_changed" > "$body_file"
            
            gh issue create \
              --title "[SDD] $title" \
              --body-file "$body_file" \
              --label "sdd" \
              --label "$BRANCH_TYPE"
            rm "$body_file"
            
            parent_num=$(gh issue list --search "[SDD] $title in:title" --state open --json number --jq '.[0].number')
            echo "Created main issue #$parent_num for $dir"
            
            if [[ -f "openspec/changes/$dir/tasks.md" ]]; then
              while IFS= read -r task; do
                task_body_file="/tmp/issue_body_${dir//-/}_task.txt"
                printf 'Parent: #%s\n\nChange: %s\nBranch: %s\nTask: %s' "$parent_num" "$dir" "$BRANCH_NAME" "$task" > "$task_body_file"
                gh issue create \
                  --title "[SDD-Task] $dir: $task" \
                  --body-file "$task_body_file" \
                  --label "sdd" \
                  --label "task"
                rm "$task_body_file"
              done < <(grep "^- \[ \] " "openspec/changes/$dir/tasks.md" | sed 's/^- \[ \] //')
              echo "Created task issues for $dir"
            fi
          done

  close-archived:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close archived issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODIFIED: ${{ toJson(github.event.head_commit.modified) }}
        run: |
          for path in $(echo "$MODIFIED" | jq -r '.[]'); do
            if [[ "$path" == openspec/changes/archive/* ]]; then
              change=$(echo "$path" | cut -d'/' -f4)
              
              main_issue=$(gh issue list --search "[SDD] $change in:title" --state open --json number --jq '.[0].number')
              if [[ -n "$main_issue" ]]; then
                gh issue close "$main_issue" --comment "Change '$change' has been archived."
                gh issue edit "$main_issue" --add-label "archived"
              fi
              
              gh issue list --search "[SDD-Task] $change in:title" --state open --json number --jq '.[].number' | while read -r task_num; do
                gh issue close "$task_num" --comment "Parent change '$change' has been archived."
                gh issue edit "$task_num" --add-label "archived"
              done
            fi
          done
