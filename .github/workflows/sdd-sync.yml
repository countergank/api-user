name: SDD Issues Sync v2

on:
  push:
    branches: [main, staging, develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**', 'chore/**']
    paths:
      - 'openspec/changes/**'
      - 'openspec/specs/**'
  pull_request:
    paths:
      - 'openspec/changes/**'
      - 'openspec/specs/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for label in sdd feature bugfix hotfix release chore enhancement task archived; do
            gh label create "$label" --description "SDD workflow label" 2>/dev/null || true
          done

      - name: Create GH_TOKEN env for subsequent steps
        run: |
          echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Detect branch type and find changes
        id: find
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          case "$branch" in
            feature/*) label="feature" ;;
            bugfix/*) label="bugfix" ;;
            hotfix/*) label="hotfix" ;;
            release/*) label="release" ;;
            chore/*) label="chore" ;;
            *) label="enhancement" ;;
          esac
          echo "BRANCH_TYPE=$label" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=$branch" >> $GITHUB_OUTPUT
          
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          fi
          echo "BASE_COMMIT=$base" >> $GITHUB_OUTPUT
          
          if [[ -n "$base" ]]; then
            changes=$(git diff --name-only "$base" HEAD -- "openspec/changes/" 2>/dev/null | \
              awk -F'openspec/changes/' '{print $2}' | \
              awk -F'/' '{print $1 "/" $2}' | \
              sort -u)
          else
            # Recursively find all changes that have proposal.md
            # Exclude: archive subtree, specs dir, refactor dir
            # Post-filter: skip changes that have an archive/ subdir (legacy structure)
            all_changes=$(find openspec/changes -mindepth 1 -type d \
              -not -path "openspec/changes/archive/*" \
              ! -name "specs" \
              ! -name "archive" \
              ! -name "refactor" \
              -exec test -f {}/proposal.md \; -print 2>/dev/null | \
              awk -F'openspec/changes/' '{print $2}' | sort -u)
            changes=""
            for c in $all_changes; do
              if [[ ! -d "openspec/changes/$c/archive" ]]; then
                changes="$changes$c"$'\n'
              fi
            done
            changes=$(echo "$changes" | sed '/^$/d')
          fi
          {
            echo "CHANGES<<EOF"
            echo "$changes"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          # Check for archive paths - detect BOTH structures:
          # Legacy: openspec/changes/<type>/<change>/archive/
          # New:    openspec/changes/archive/<YYYY-MM-DD>-<name>/
          archive_changes=""
          
          # Legacy structure: find directories named "archive" under type/change/
          for archive_dir in $(find openspec/changes -mindepth 3 -type d -name archive 2>/dev/null); do
            change_dir=$(dirname "$archive_dir")
            change_name=$(echo "$change_dir" | awk -F'openspec/changes/' '{print $2}')
            if [[ -n "$change_name" ]]; then
              archive_changes="$archive_changes $change_name"
            fi
          done
          
          # New structure: find directories under openspec/changes/archive/
          if [[ -d "openspec/changes/archive" ]]; then
            for archive_dir in $(find openspec/changes/archive -mindepth 1 -maxdepth 1 -type d 2>/dev/null); do
              change_name=$(echo "$archive_dir" | awk -F'openspec/changes/archive/' '{print $2}')
              if [[ -n "$change_name" ]]; then
                archive_changes="$archive_changes archive/$change_name"
              fi
            done
          fi
          
          archive_changes=$(echo "$archive_changes" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ //;s/ $//')
          echo "ARCHIVE_CHANGES=$archive_changes" >> $GITHUB_OUTPUT

      - name: Create SDD issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changes="${{ steps.find.outputs.CHANGES }}"
          branch_name="${{ steps.find.outputs.BRANCH_NAME }}"
          branch_type="${{ steps.find.outputs.BRANCH_TYPE }}"
          base_commit="${{ steps.find.outputs.BASE_COMMIT }}"
          archive_changes="${{ steps.find.outputs.ARCHIVE_CHANGES }}"
          
          echo "$changes" | while read -r change; do
            [[ -z "$change" ]] && continue
            
            # Skip archive changes (they are handled by close job)
            if echo " $archive_changes " | grep -q " $change "; then
              continue
            fi
            
            title="$change"
            summary="SDD change: $change"
            
            existing=$(gh issue list --search "[SDD] $title in:title" --state open --json number --jq '.[0].number')
            if [[ -n "$existing" ]]; then
              echo "Found existing issue #$existing for $change"
              continue
            fi
            
            body_file="/tmp/issue_body_${change//\//-}_main.txt"
            printf 'Change: %s\nBranch: %s\nType: %s\nPhase: implementation\n---\nGenerated by SDD Issue Sync\n' "$change" "$branch_name" "$branch_type" > "$body_file"
            
            issue_url=$(gh issue create \
              --title "[SDD] $title" \
              --body-file "$body_file" \
              --label "sdd" \
              --label "$branch_type" 2>&1)
            rm "$body_file"
            
            parent_num=$(echo "$issue_url" | grep -oE '/[0-9]+$' | grep -oE '[0-9]+')
            echo "Created main issue #$parent_num for $change"
            
            if [[ -f "openspec/changes/$change/tasks.md" ]]; then
              while IFS= read -r task; do
                task_body_file="/tmp/issue_body_${change//\//-}_task.txt"
                printf 'Parent: #%s\n\nChange: %s\nBranch: %s\nTask: %s\n' "$parent_num" "$change" "$branch_name" "$task" > "$task_body_file"
                gh issue create \
                  --title "[SDD-Task] $change: $task" \
                  --body-file "$task_body_file" \
                  --label "sdd" \
                  --label "task"
                rm "$task_body_file"
              done < <(grep "^- \[ \] " "openspec/changes/$change/tasks.md" | sed 's/^- \[ \] //')
              echo "Created task issues for $change"
            fi
          done

      - name: Close archived issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive_changes="${{ steps.find.outputs.ARCHIVE_CHANGES }}"
          echo "ARCHIVE_CHANGES=$archive_changes"
          for change in $archive_changes; do
            [[ -z "$change" ]] && continue
            
            echo "Processing archived change: $change"
            
            # Extract change name for matching
            # For new structure: archive/2026-05-14-admin-crud → admin-crud
            # For legacy structure: feature/admin-crud → admin-crud
            if [[ "$change" == archive/* ]]; then
              # New structure: strip date prefix (YYYY-MM-DD-) to get base name
              base_name=$(echo "$change" | awk -F'/' '{print $2}' | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
              # Also try matching with full name (date-prefixed)
              full_name=$(echo "$change" | awk -F'/' '{print $2}')
            else
              base_name=$(echo "$change" | awk -F'/' '{print $NF}')
              full_name="$base_name"
            fi
            
            # Search for main issue using exact title match via in:title
            main_issue=$(gh issue list --search "[SDD] in:title" --state all --json number,title,state --jq '[.[] | select(.title | test("'"[SDD] ${full_name}$"'";"i"))] | .[0].number' 2>/dev/null)
            if [[ -z "$main_issue" ]]; then
              main_issue=$(gh issue list --search "[SDD] in:title" --state all --json number,title,state --jq '[.[] | select(.title | test("'"[SDD] ${base_name}$"'";"i"))] | .[0].number' 2>/dev/null)
            fi
            main_state=$(gh issue list --search "[SDD] in:title" --state all --json number,title,state --jq '[.[] | select(.number == '"$main_issue"')] | .[0].state' 2>/dev/null)
            echo "Found main issue: $main_issue (state: $main_state)"
            
            if [[ -n "$main_issue" && "$main_state" == "open" ]]; then
              gh issue close "$main_issue" --comment "Change '$change' has been archived."
              gh issue edit "$main_issue" --add-label "archived"
              echo "Closed main issue #$main_issue"
            elif [[ -n "$main_issue" ]]; then
              echo "Issue #$main_issue is already closed, skipping"
              gh issue edit "$main_issue" --add-label "archived" 2>/dev/null || true
            fi
            
            # Search for task issues - match by change name in title
            task_list=$(gh issue list --search "[SDD-Task] in:title" --state all --json number,title,state --jq '[.[] | select(.title | test("'"${base_name}"'";"i"))] | .[] | "\(.number) \(.state)"' 2>/dev/null)
            
            if [[ -n "$task_list" ]]; then
              echo "$task_list" | while read -r task_num task_state; do
                [[ -z "$task_num" ]] && continue
                if [[ "$task_state" == "OPEN" ]]; then
                  gh issue close "$task_num" --comment "Parent change '$change' has been archived."
                  gh issue edit "$task_num" --add-label "archived"
                  echo "Closed task issue #$task_num"
                else
                  gh issue edit "$task_num" --add-label "archived" 2>/dev/null || true
                  echo "Task issue #$task_num is already closed, added label"
                fi
              done
            else
              echo "No task issues found for $change"
            fi
          done
