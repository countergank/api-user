name: SDD Issues Sync

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**', 'chore/**']
    paths:
      - 'openspec/changes/**'
      - 'openspec/specs/**'
  pull_request:
    paths:
      - 'openspec/changes/**'
      - 'openspec/specs/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for label in sdd feature bugfix hotfix release chore enhancement task archived; do
            gh label create "$label" --description "SDD workflow label" 2>/dev/null || true
          done

      - name: Detect branch type and find changes
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          case "$branch" in
            feature/*) label="feature" ;;
            bugfix/*) label="bugfix" ;;
            hotfix/*) label="hotfix" ;;
            release/*) label="release" ;;
            chore/*) label="chore" ;;
            *) label="enhancement" ;;
          esac
          echo "BRANCH_TYPE=$label" >> $GITHUB_ENV
          echo "BRANCH_NAME=$branch" >> $GITHUB_ENV
          
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          fi
          echo "BASE_COMMIT=$base" >> $GITHUB_ENV
          
          if [[ -n "$base" ]]; then
            changes=$(git diff --name-only "$base" HEAD -- "openspec/changes/" 2>/dev/null | \
              awk -F'openspec/changes/' '{print $2}' | \
              awk -F'/' '{print $1 "/" $2}' | \
              sort -u)
          else
            changes=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null)
          fi
          echo "CHANGES=$changes" >> $GITHUB_ENV
          
          # Check for archive paths
          archive_changes=""
          for path in $(git diff --name-only "$base" HEAD -- "openspec/changes/archive/" 2>/dev/null); do
            change=$(echo "$path" | awk -F'openspec/changes/archive/' '{print $2}' | awk -F'/' '{print $1 "/" $2}')
            archive_changes="$archive_changes $change"
          done
          echo "ARCHIVE_CHANGES=$archive_changes" >> $GITHUB_ENV

      - name: Create SDD issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$CHANGES" | while read -r change; do
            [[ -z "$change" ]] && continue
            
            # Skip archive changes (they are handled by close job)
            if echo " $ARCHIVE_CHANGES " | grep -q " $change "; then
              continue
            fi
            
            title="$change"
            summary="SDD change: $change"
            if [[ -f "openspec/changes/$change/proposal.md" ]]; then
              title=$(grep "^# " "openspec/changes/$change/proposal.md" | sed 's/^# //')
              summary=$(awk '/^## /{found=1; next} found && NF{print; exit}' "openspec/changes/$change/proposal.md" | head -1)
              [[ -z "$summary" ]] && summary="SDD change: $change"
            fi
            
            existing=$(gh issue list --search "[SDD] $title in:title" --state open --json number --jq '.[0].number')
            if [[ -n "$existing" ]]; then
              echo "Found existing issue #$existing for $change"
              continue
            fi
            
            files_changed=$(git diff --name-only "$BASE_COMMIT" HEAD -- "openspec/changes/$change/" 2>/dev/null | sed 's/^/  /' || echo "  (no changes)")
            
            body_file="/tmp/issue_body_${change//\//-}_main.txt"
            printf '## Summary\n\nChange: %s\nBranch: %s\nType: %s\nPhase: implementation\n\n### Overview\n%s\n\n### Files Changed\n```\n%s\n```\n\n---\nGenerated by SDD Issue Sync v2\n' "$change" "$BRANCH_NAME" "$BRANCH_TYPE" "$summary" "$files_changed" > "$body_file"
            
            issue_url=$(gh issue create \
              --title "[SDD] $title" \
              --body-file "$body_file" \
              --label "sdd" \
              --label "$BRANCH_TYPE" 2>&1)
            rm "$body_file"
            
            parent_num=$(echo "$issue_url" | grep -oE '/[0-9]+$' | grep -oE '[0-9]+')
            echo "Created main issue #$parent_num for $change"
            
            if [[ -f "openspec/changes/$change/tasks.md" ]]; then
              while IFS= read -r task; do
                task_body_file="/tmp/issue_body_${change//\//-}_task.txt"
                printf 'Parent: #%s\n\nChange: %s\nBranch: %s\nTask: %s\n' "$parent_num" "$change" "$BRANCH_NAME" "$task" > "$task_body_file"
                gh issue create \
                  --title "[SDD-Task] $change: $task" \
                  --body-file "$task_body_file" \
                  --label "sdd" \
                  --label "task"
                rm "$task_body_file"
              done < <(grep "^- \[ \] " "openspec/changes/$change/tasks.md" | sed 's/^- \[ \] //')
              echo "Created task issues for $change"
            fi
          done

      - name: Close archived issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for change in $ARCHIVE_CHANGES; do
            [[ -z "$change" ]] && continue
            
            echo "Processing archived change: $change"
            
            main_issue=$(gh issue list --search "[SDD] $change in:title" --state open --json number --jq '.[0].number')
            if [[ -n "$main_issue" ]]; then
              gh issue close "$main_issue" --comment "Change '$change' has been archived."
              gh issue edit "$main_issue" --add-label "archived"
              echo "Closed main issue #$main_issue"
            fi
            
            gh issue list --search "[SDD-Task] $change in:title" --state open --json number --jq '.[].number' | while read -r task_num; do
              gh issue close "$task_num" --comment "Parent change '$change' has been archived."
              gh issue edit "$task_num" --add-label "archived"
              echo "Closed task issue #$task_num"
            done
          done
