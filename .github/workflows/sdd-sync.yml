name: SDD Issues Sync

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
    paths:
      - openspec/changes/**
      - openspec/specs/**
  pull_request:
    paths:
      - openspec/changes/**
      - openspec/specs/**

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed dirs
        id: dirs
        run: |
          base=""
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base=${{ github.event.pull_request.base.sha }}
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base=${{ github.event.before }}
          fi
          
          if [[ -n "$base" ]]; then
            dirs=$(git diff --name-only $base HEAD -- "openspec/changes/" "openspec/specs/" 2>/dev/null | sed 's|openspec/changes/||' | sed 's|openspec/specs/||' | cut -d'/' -f1 | sort -u | grep -v '^$')
          else
            # First push - get all directories
            dirs=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          fi
          
          echo "dirs=$dirs" >> $GITHUB_OUTPUT

      - name: Create issues
        if: steps.dirs.outputs.dirs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in ${{ steps.dirs.outputs.dirs }}; do
            title="$dir"
            if [[ -f "openspec/changes/$dir/proposal.md" ]]; then
              title=$(grep "^# " "openspec/changes/$dir/proposal.md" | sed 's/^# //')
            fi
            
            # Check if already exists
            existing=$(gh issue list --search "[SDD] $title in:title" -q '.[0].number // empty')
            if [[ -z "$existing" ]]; then
              gh issue create --title "[SDD] $title" --body "Change: $dir" --label "sdd" --label "enhancement"
            fi
            
            if [[ -f "openspec/changes/$dir/tasks.md" ]]; then
              grep "^- \[ \] " "openspec/changes/$dir/tasks.md" | sed 's/^- \[ \] //' | while read task; do
                existing=$(gh issue list --search "$task in:title" -q '.[0].number // empty')
                if [[ -z "$existing" ]]; then
                  gh issue create --title "[SDD-Task] $task" --body "Parent: $dir" --label "sdd" --label "task"
                fi
              done
            fi
          done