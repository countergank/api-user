name: SDD Issues Sync

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**', 'chore/**']
    paths:
      - 'openspec/changes/**'
      - '!openspec/changes/archive/**'
      - 'openspec/specs/**'
  pull_request:
    paths:
      - 'openspec/changes/**'
      - '!openspec/changes/archive/**'
      - 'openspec/specs/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch type
        id: branch-type
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          case "$branch" in
            feature/*)  label="feature" ;;
            bugfix/*)   label="bugfix" ;;
            hotfix/*)   label="hotfix" ;;
            release/*)  label="release" ;;
            chore/*)    label="chore" ;;
            *)          label="enhancement" ;;
          esac
          echo "type=$label" >> $GITHUB_OUTPUT
          echo "branch=$branch" >> $GITHUB_OUTPUT

      - name: Find SDD changes
        id: find
        run: |
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base=${{ github.event.pull_request.base.sha }}
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base=${{ github.event.before }}
          fi
          
          if [[ -n "$base" ]]; then
            CHANGED=$(git diff --name-only $base HEAD -- "openspec/changes/" "openspec/specs/" 2>/dev/null | grep -v '^$' | cut -d'/' -f3 | sort -u)
          else
            CHANGED=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null)
          fi
          echo "changes=$CHANGED" >> $GITHUB_OUTPUT

      - name: Create SDD issues
        if: steps.find.outputs.changes != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES: ${{ steps.find.outputs.changes }}
          BRANCH_TYPE: ${{ steps.branch-type.outputs.type }}
          BRANCH_NAME: ${{ steps.branch-type.outputs.branch }}
        run: |
          echo "$CHANGES" | tr ' ' '\n' | while read dir; do
            [[ -z "$dir" ]] && continue
            
            title="$dir"
            summary="SDD change: $dir"
            if [[ -f "openspec/changes/$dir/proposal.md" ]]; then
              title=$(grep "^# " "openspec/changes/$dir/proposal.md" | sed 's/^# //')
              summary=$(awk '/^## /{found=1; next} found && NF{print; exit}' "openspec/changes/$dir/proposal.md" | head -1)
              [[ -z "$summary" ]] && summary="SDD change: $dir"
            fi
            
            files_changed=$(git diff --name-only $base HEAD -- "openspec/changes/$dir/" 2>/dev/null | sed 's/^/  /' || echo "  (no changes detected)")
            
            existing=$(gh issue list --search "[SDD] $title in:title" --state open --json number --jq '.[0].number' 2>/dev/null)
            
            if [[ -n "$existing" ]]; then
              echo "Issue already exists: #$existing - skipping creation for $dir"
              continue
            fi
            
            body="## Summary\n\n**Change**: $dir\n**Branch**: $BRANCH_NAME\n**Type**: $BRANCH_TYPE\n**Phase**: implementation\n\n### Overview\n$summary\n\n### Files Changed\n\`\`\`\n$files_changed\n\`\`\`\n\n---\n*Generated by SDD Issue Sync v2*"
            
            parent_num=$(gh issue create \
              --title "[SDD] $title" \
              --body "$body" \
              --label "sdd" \
              --label "$BRANCH_TYPE" \
              --json number --jq '.number')
            
            echo "Created main issue #$parent_num for $dir"
            
            if [[ -f "openspec/changes/$dir/tasks.md" ]]; then
              grep "^- \[ \] " "openspec/changes/$dir/tasks.md" | sed 's/^- \[ \] //' | while read task; do
                task_body="**Parent**: #$parent_num%n%n**Change**: $dir%n**Branch**: $BRANCH_NAME%n**Task**: $task"
                gh issue create \
                  --title "[SDD-Task] $dir: $task" \
                  --body "$task_body" \
                  --label "sdd" \
                  --label "task"
              done
              echo "Created task issues for $dir"
            fi
          done

  close-archived:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find archived changes
        id: find-archived
        env:
          MODIFIED: ${{ toJson(github.event.head_commit.modified) }}
        run: |
          ARCHIVED=""
          for path in $(echo "$MODIFIED" | jq -r '.[]'); do
            if [[ "$path" == openspec/changes/archive/* ]]; then
              change=$(echo "$path" | cut -d'/' -f4)
              ARCHIVED="$ARCHIVED $change"
            fi
          done
          echo "archived=$ARCHIVED" >> $GITHUB_OUTPUT

      - name: Close archived issues
        if: steps.find-archived.outputs.archived != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVED_CHANGES: ${{ steps.find-archived.outputs.archived }}
        run: |
          for change in $ARCHIVED_CHANGES; do
            [[ -z "$change" ]] && continue
            
            echo "Processing archived change: $change"
            
            main_issue=$(gh issue list --search "[SDD] $change in:title" --state open --json number --jq '.[0].number' 2>/dev/null)
            if [[ -n "$main_issue" ]]; then
              gh issue close "$main_issue" --comment "Change '$change' has been archived. This issue is now closed."
              gh issue edit "$main_issue" --add-label "archived"
              echo "Closed main issue #$main_issue"
            fi
            
            gh issue list --search "[SDD-Task] $change in:title" --state open --json number --jq '.[].number' 2>/dev/null | while read task_num; do
              gh issue close "$task_num" --comment "Parent change '$change' has been archived. This task is now closed."
              gh issue edit "$task_num" --add-label "archived"
              echo "Closed task issue #$task_num"
            done
          done
