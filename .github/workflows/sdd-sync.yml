name: SDD Issues Sync

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
    paths:
      - openspec/changes/**
      - openspec/specs/**
  pull_request:
    paths:
      - openspec/changes/**
      - openspec/specs/**

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find SDD changes
        id: find
        run: |
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base=${{ github.event.pull_request.base.sha }}
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base=${{ github.event.before }}
          fi
          
          if [[ -n "$base" ]]; then
            CHANGED=$(git diff --name-only $base HEAD -- "openspec/changes/" "openspec/specs/" 2>/dev/null | grep -v '^$' | cut -d'/' -f3 | sort -u)
          else
            CHANGED=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null)
          fi
          echo "changes=$CHANGED" >> $GITHUB_OUTPUT

      - name: Create SDD issues
        if: steps.find.outputs.changes != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES: ${{ steps.find.outputs.changes }}
        run: |
          echo "$CHANGES" | tr ' ' '\n' | while read dir; do
            [[ -z "$dir" ]] && continue
            
            # Get title
            title="$dir"
            if [[ -f "openspec/changes/$dir/proposal.md" ]]; then
              title=$(grep "^# " "openspec/changes/$dir/proposal.md" | sed 's/^# //')
            fi
            
            # Create main issue
            gh issue create --title "[SDD] $title" --body "Change: $dir" --label "sdd" --label "enhancement"
            
            # Create task issues
            if [[ -f "openspec/changes/$dir/tasks.md" ]]; then
              grep "^- \[ \] " "openspec/changes/$dir/tasks.md" | sed 's/^- \[ \] //' | while read task; do
                gh issue create --title "[SDD-Task] $task" --body "Parent: $dir" --label "sdd" --label "task"
              done
            fi
          done