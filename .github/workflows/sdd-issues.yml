name: SDD to Issues
on:
  push:
    branches: [main, develop]
    paths: [openspec/**]
  pull_request:
    paths: [openspec/**]
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: datanfr/actions/create-issue@v1
        with:
          title: "Test issue"
          body: "Testing GitHub Action"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}